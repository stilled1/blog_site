{% extends 'blog/base.html' %}

{% block title %} Регистрация {% endblock %}
{% block content %}
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <p>
                {{ field.label }} : {{ field }}
                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            </p>
        {% endfor %}
        <input type="submit" value="Зарегистрироваться">

    </form>
    <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>

{% endblock %}
