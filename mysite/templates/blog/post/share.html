{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поделиться постом — {{ post.title }}</title>
    <link href="{% static 'css/block.css' %}" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h1>Поделиться постом «{{ post.title }}»</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Отправить</button>
        </form>
    </div>
</body>
</html>
